name: Build Bud Step 3 Worker

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Download model files from S3
        env:
          MODEL_S3_BUCKET: ${{ secrets.MODEL_S3_BUCKET }}
        run: |
          set -euo pipefail
          mkdir -p models
          aws s3 cp "s3://${MODEL_S3_BUCKET}/models/bud-step3/CaneY26V10.pt" "models/CaneY26V10.pt"
          aws s3 cp "s3://${MODEL_S3_BUCKET}/models/bud-step3/WinBudy12n.pt" "models/WinBudy12n.pt"
          aws s3 cp "s3://${MODEL_S3_BUCKET}/models/bud-step3/Male_Yolo_26_Final.pt" "models/Male_Yolo_26_Final.pt"
          test -s "models/CaneY26V10.pt"
          test -s "models/WinBudy12n.pt"
          test -s "models/Male_Yolo_26_Final.pt"
          ls -lh models

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/tau-bud-step3-worker:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/tau-bud-step3-worker:${{ github.sha }}
